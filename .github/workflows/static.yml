# Build, test, and deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master", "moving"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/StaticWebGenerator.sln

      - name: Build
        run: dotnet build src/StaticWebGenerator.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/StaticWebGenerator.sln --no-build -c Release --verbosity normal

      - name: Generate site
        run: dotnet run --no-build -c Release --project src/CommandLine/CommandLine.csproj -- build

      - name: Upload site artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/moving'))
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/CommandLine/_public

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/moving'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
